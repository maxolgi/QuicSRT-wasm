<!doctype html>
<!-- M3 minimal player page: player SDK (page/vendor/) + the C++ wasm
     engine worker. Served by the QuicSRT-gateway from dist/
     (./build.sh deploy; COOP/COEP on every response: the emcc engine uses
     pthreads, which need a cross-origin-isolated context). -->
<html>
<head>
    <meta charset="utf-8">
    <title>QuicSRT-wasm player</title>
    <style>
        body { font: 14px monospace; margin: 1em; background: #111; color: #ddd; }
        canvas { width: 100%; max-width: 960px; background: #000; display: block; cursor: pointer; }
        #stats { position: fixed; top: 1em; right: 1em; white-space: pre-line; }
    </style>
</head>
<body>
    <canvas id="video"></canvas>
    <div id="stats">rtt - bw - elapsed -
rx: -
tx: -</div>
    <script src="/cert-hash.js"></script>
    <script type="module" src="/bundle/app.js"></script>
</body>
</html>
