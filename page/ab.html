<!doctype html>
<!-- M4 A/B harness: Rust engine vs C++ engine as concurrent subscribers of
     the same live WebSRT stream, one WebTransport session + module worker
     each. Byte-level comparison of what each engine DELIVERED (SHA-256 of
     concatenated payload + per-second buckets) plus per-engine SRT stats.
     Serve with page/serve.mjs (COOP/COEP everywhere - the C++ engine uses
     pthreads). ?stream=&latency=&host=&port= like the player. -->
<html>
<head>
    <meta charset="utf-8">
    <title>srt-wasm-cpp A/B harness</title>
    <style>
        body { font: 14px monospace; margin: 1em; background: #111; color: #ddd; }
        #cfg { color: #888; margin: .5em 0; }
        button { font: inherit; margin-right: .5em; padding: .2em 1em; }
        button:disabled { opacity: .4; }
        table { border-collapse: collapse; margin: 1em 0; }
        th, td { border: 1px solid #333; padding: .25em .6em; text-align: left; font-weight: normal; }
        thead th { color: #f90; }
        td.state { min-width: 22em; }
        td.hash { font-size: 12px; }
        #verdict { color: #6c6; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h3>A/B: Rust srt-wasm vs C++ srt-wasm-cpp</h3>
    <div>
        <button id="start">START</button>
        <button id="stop" disabled>STOP</button>
    </div>
    <div id="cfg">-</div>
    <table id="results"></table>
    <div id="verdict">idle — pick a live stream (?stream=), press START, wait, press STOP</div>
    <script src="/cert-hash.js"></script>
    <script type="module" src="/bundle/ab.js"></script>
</body>
</html>
