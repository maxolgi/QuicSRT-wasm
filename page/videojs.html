<!doctype html>
<!-- video.js demo page for the QuicSrtTech (page/adapters/videojs/tech):
     the stock video.js skin playing a QuicSRT source — intentionally no
     custom controls, just this heading and the status line. Source params
     match the viewer page (?stream=, ?host=/?port= with window.WT_PORT
     from /cert-hash.js, ?token=, ?latency=; ?wt=<full WT url> to pass an
     endpoint through). The module entry is the esbuild bundle
     /bundle/videojs.js; its video-js.css import lands as the sidecar
     /bundle/videojs.css (esbuild emits imported CSS as a sibling file),
     linked below. Served by the QuicSRT-gateway from dist/ (./build.sh
     deploy; COOP/COEP on every response: the emcc engine uses pthreads,
     which need a cross-origin-isolated context). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/quicsrt.png" />
    <link rel="stylesheet" href="/bundle/videojs.css" />
    <title>QuicSRT-wasm video.js</title>
    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #111;
        color: #ddd;
        margin: 0;
        padding: 1.5rem;
      }
      h1 { font-size: 1.1rem; }
      #stage { width: min(100%, 960px); }
      #status { margin-top: 8px; font-size: 12px; color: #999; word-break: break-all; }
    </style>
  </head>
  <body>
    <h1>QuicSRT via video.js (stock skin)</h1>
    <div id="stage">
      <video-js id="player" class="video-js vjs-big-play-centered"></video-js>
    </div>
    <p id="status"></p>
    <script src="/cert-hash.js"></script>
    <script type="module" src="/bundle/videojs.js"></script>
  </body>
</html>
