; Dev-machine player-page server for websrt-wasm-cpp (M3/M4 pages on :8099).
; Serves page/ + the engine build with COOP/COEP; /cert-hash.js is proxied
; live from the local websrt-cpp gateway (https://127.0.0.1:8443).
; Deploy: sudo cp websrt-wasm-cpp-page.conf /etc/supervisor/conf.d/ &&
;         sudo supervisorctl reread && sudo supervisorctl update
[program:websrt-wasm-cpp-page]
command=/usr/bin/node page/serve.mjs
directory=/home/flibb/maxolgi/websrt-wasm-cpp
user=flibb
autostart=true
autorestart=true
startsecs=2
startretries=10
stdout_logfile=/var/log/websrt-wasm-cpp/page.out.log
stderr_logfile=/var/log/websrt-wasm-cpp/page.err.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=2
