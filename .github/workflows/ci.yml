# CI for QuicSRT-wasm: build the full dist/ tree the gateway serves
# (setup -> lib -> engine -> page -> deploy) and run the node gate suite
# (AGENTS.md). The assembled dist/ is uploaded as a workflow artifact.

name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (same as libquicsrt's ci).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The full chain runs twice - on the ubuntu-24.04 runner image and in
  # a Debian 13 (trixie) container - as a separate job because
  # `container:` cannot be set conditionally from a matrix (SlopShady's
  # build-linux pattern). The dist/ output is pure Emscripten + js; the
  # release below ships the ubuntu-built dist/ artifact.
  build-dist:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Emscripten
        # build.sh sources ~/emsdk/emsdk_env.sh, so emsdk must live at
        # exactly that path. 6.0.8 is the toolchain the port was built
        # and byte-parity-verified with.
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 6.0.8
          "$HOME/emsdk/emsdk" activate 6.0.8
      - name: Setup (deps/libquicsrt + nested deps/srt)
        run: ./build.sh setup
      - name: Build libquicsrt receiver-only + srt (Emscripten)
        run: ./build.sh lib
      - name: Build engine
        run: ./build.sh engine
      - name: Install esbuild
        run: npm ci
      - name: Bundle pages
        run: ./build.sh page
      - name: Assemble dist/
        run: ./build.sh deploy
      - name: Node gates
        # exit 0 = pass; engine_smoke drives the freshly built engine
        # end-to-end through a fake WebTransport (2000 messages,
        # byte-identical delivery + stats/bucket accounting).
        run: |
          node js/test_contract.mjs
          node js/demux_parity.mjs
          node js/muxer_parity.mjs
          node js/engine_smoke.mjs
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Debian 13 (trixie) container, like SlopShady's build-linux: pins the
  # build environment (cmake/make/python/node) instead of the rolling
  # ubuntu runner image. Same chain + node gates; uploads dist-debian so
  # the two trees can be diffed.
  build-dist-debian:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 60
    steps:
      # Must precede checkout: git is not in the base image and checkout
      # falls back to a REST download (no submodules) without it.
      # python3 + xz-utils: emsdk downloads/unpacks the 6.0.8 toolchain;
      # build-essential + cmake: the emcmake/make build in ./build.sh lib.
      - name: Install build deps (Debian trixie)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 xz-utils \
            build-essential cmake
      - uses: actions/checkout@v5
      # Steps run as root in the container but the bind-mounted workspace
      # is owned by the host runner user, so the submodule init in
      # ./build.sh setup dies with "dubious ownership" (checkout sets
      # safe.directory only in its own temporary HOME). This writes the
      # persistent $HOME/.gitconfig (/github/home) for the whole job.
      - name: Trust the workspace repo
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Emscripten
        # build.sh sources ~/emsdk/emsdk_env.sh, so emsdk must live at
        # exactly that path. 6.0.8 is the toolchain the port was built
        # and byte-parity-verified with.
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 6.0.8
          "$HOME/emsdk/emsdk" activate 6.0.8
      - name: Setup node
        # ubuntu runner images preinstall node; the bare trixie container
        # does not.
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Setup (deps/libquicsrt + nested deps/srt)
        run: ./build.sh setup
      - name: Build libquicsrt receiver-only + srt (Emscripten)
        run: ./build.sh lib
      - name: Build engine
        run: ./build.sh engine
      - name: Install esbuild
        run: npm ci
      - name: Bundle pages
        run: ./build.sh page
      - name: Assemble dist/
        run: ./build.sh deploy
      - name: Node gates
        # exit 0 = pass; engine_smoke drives the freshly built engine
        # end-to-end through a fake WebTransport (2000 messages,
        # byte-identical delivery + stats/bucket accounting).
        run: |
          node js/test_contract.mjs
          node js/demux_parity.mjs
          node js/muxer_parity.mjs
          node js/engine_smoke.mjs
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist-debian
          path: dist/
          if-no-files-found: error

  # Publish a GitHub Release for every successful master build, like
  # QuicSRT-gateway's ci: master
  # push -> dev-<short_sha> marked latest (must NOT be a prerelease -
  # GitHub ignores make_latest on pre-releases, losing the Latest badge
  # and /releases/latest); v* tag push -> stable release tagged
  # <version>. The dist tree rides as quicsrt-wasm-dist.zip with its
  # contents at the zip root (unzip -d <web_root>) - the asset the
  # gateway fetches.
  release:
    needs: [build-dist, build-dist-debian]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: artifacts/dist
      - name: Stage release asset
        run: |
          mkdir -p release
          (cd artifacts/dist && zip -q -r "$GITHUB_WORKSPACE/release/quicsrt-wasm-dist.zip" .)
          unzip -l release/quicsrt-wasm-dist.zip
      - name: Set release metadata
        id: meta
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          short="${SHA:0:7}"
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "tag=${REF#refs/tags/}"    >> "$GITHUB_OUTPUT"
            echo "name=${REF#refs/tags/}"   >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${short}"         >> "$GITHUB_OUTPUT"
            echo "name=Dev ${short}"        >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: false
          make_latest: true
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
